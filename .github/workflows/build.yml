name: Build Handsfree Extension

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting and linting
        run: npm run lint

      - name: Type check TypeScript
        run: npm run compile

      - name: Build and package extension for Chrome
        run: npm run zip

      - name: Build and package extension for Edge
        run: npm run zip:edge

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: handsfree-chrome
          path: .output/*chrome*.zip

      - name: Upload Edge build artifact
        uses: actions/upload-artifact@v4
        with:
          name: handsfree-edge
          path: .output/*edge*.zip
